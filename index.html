<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me la pasé increíble ayer ❤️💀</title>
    
    <!-- Tailwind CSS y Fuentes Google -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Cinzel:wght@700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            background-color: #0b0312;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
        }

        /* Fondo Místico Noche Halloween / Día de Muertos */
        .spooky-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, #310a40 0%, #150221 60%, #06010a 100%);
            z-index: 1;
        }

        /* Luz cálida de veladoras y flores de cempasúchil */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.45;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }
        .orb-orange { top: 10%; left: 15%; width: 350px; height: 350px; background: #ff7b00; }
        .orb-purple { bottom: 10%; right: 15%; width: 380px; height: 380px; background: #9d4edd; animation-delay: -3s; }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
            100% { transform: scale(1.2) translate(20px, -20px); opacity: 0.6; }
        }

        /* Tarjeta de Cristal Festiva */
        .spooky-card {
            background: rgba(26, 9, 36, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 154, 60, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border-radius: 32px;
        }

        .font-cursive { font-family: 'Caveat', cursive; }
        .font-title { font-family: 'Cinzel', serif; }

        /* Efecto Neón Cempasúchil / Halloween */
        .text-glow-orange {
            text-shadow: 0 0 20px rgba(255, 123, 0, 0.7), 0 0 40px rgba(255, 123, 0, 0.3);
        }
        .text-glow-purple {
            text-shadow: 0 0 20px rgba(181, 23, 158, 0.7);
        }

        /* Animaciones */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.5s; }
        .delay-3 { animation-delay: 0.8s; }

        /* Icono temático flotante */
        .floating-icon {
            display: inline-block;
            animation: floatSlow 3s ease-in-out infinite alternate;
        }
        @keyframes floatSlow {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-12px) rotate(5deg); }
        }

        /* Partículas / Emojis Voladores */
        .spooky-particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: burstSpooky 1.6s cubic-bezier(0.15, 0.8, 0.3, 1) forwards;
        }
        @keyframes burstSpooky {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translateY(-180px) scale(1.6) rotate(35deg); }
        }
    </style>
</head>
<body class="flex justify-center items-center p-4 sm:p-6 relative">

    <!-- Fondo de Noche Mística -->
    <div class="spooky-bg">
        <div class="glow-orb orb-orange"></div>
        <div class="glow-orb orb-purple"></div>
    </div>

    <!-- Contenedor Principal -->
    <main class="relative z-10 w-full max-w-md my-auto">

        <div class="spooky-card p-8 sm:p-10 text-center relative overflow-hidden fade-in delay-1">
            
            

            <!-- Iconos Centrales Animados -->
            <div class="text-6xl mb-4 floating-icon">
                💀✨🎃
            </div>

            <!-- Titulo Principal -->
            <h1 class="font-title text-3xl sm:text-4xl font-extrabold text-amber-400 text-glow-orange tracking-wide leading-tight mb-4">
                ¡Me la pasé increíble ayer!
            </h1>

            <p class="text-gray-300 text-base font-light leading-relaxed mb-6 fade-in delay-2">
                Fue una salida súper especial y disfruté cada segundo a tu lado.
            </p>

            <div class="w-24 h-0.5 bg-gradient-to-r from-transparent via-amber-500/50 to-transparent mx-auto my-6"></div>

            <!-- Mensaje Te Quiero -->
            <div class="fade-in delay-3">
                <p class="text-xs uppercase tracking-widest text-purple-300 font-semibold mb-2">
                    Solo quería decirte que...
                </p>

                <div class="font-cursive text-6xl sm:text-7xl text-amber-300 text-glow-orange leading-none my-3">
                    ¡Te quiero mucho! ❤️
                </div>
            </div>

            <!-- Botón Interactivo de Hechizo -->
            <div class="mt-8 fade-in delay-3">
                <button id="spookyBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 via-orange-500 to-purple-600 hover:opacity-95 text-white font-bold text-sm tracking-widest uppercase shadow-lg shadow-orange-500/30 active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <span>✨ click  ✨</span>
                </button>
            </div>

        </div>

     

    </main>

    <!-- Script de Efectos -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('spookyBtn');
            const items = ['💀', '🌼', '🎃', '❤️', '🦇', '✨', '🕯️', '💖'];

            btn.addEventListener('click', (e) => {
                const rect = btn.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                // Ráfaga de elementos de Halloween y Día de Muertos
                for (let i = 0; i < 16; i++) {
                    spawnParticle(centerX, centerY);
                }
            });

            function spawnParticle(x, y) {
                const el = document.createElement('div');
                el.classList.add('spooky-particle');
                
                // Elemento aleatorio
                el.innerText = items[Math.floor(Math.random() * items.length)];

                const spreadX = (Math.random() - 0.5) * 220;
                const size = Math.random() * 1.3 + 1.2;

                el.style.left = `${x + spreadX}px`;
                el.style.top = `${y}px`;
                el.style.fontSize = `${size}rem`;
                el.style.animationDuration = `${Math.random() * 0.8 + 1.1}s`;

                document.body.appendChild(el);

                setTimeout(() => {
                    el.remove();
                }, 1600);
            }
        });
    </script>
</body>
</html>
